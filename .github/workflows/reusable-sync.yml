name: reusable-sync
on:
  workflow_call: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LIGHT_CI_PAT }}
      - name: attempt upstream merge
        env:
          GH_TOKEN: ${{ secrets.LIGHT_CI_PAT }}
        run: |
          set -euo pipefail
          git config user.name  "light-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/lightphone/light-sdk.git
          git fetch upstream main --quiet
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."; exit 0
          fi
          OPEN_SYNC=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open" --jq '[.[] | select(.head.ref | startswith("sync/upstream-"))] | length')
          if [ "$OPEN_SYNC" -gt 0 ]; then
            echo "An open sync PR already exists; resolve it first. Skipping this run."; exit 0
          fi
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          if git merge --no-edit upstream/main; then
            RESULT=clean
          else
            UNMERGED=$(git diff --name-only --diff-filter=U)
            OUTSIDE=$(echo "$UNMERGED" | grep -v '^tool/' || true)
            if [ -z "$OUTSIDE" ]; then
              # All conflicts are inside tool/ — our tool module always wins.
              # DU = deleted by us (we removed the sample; upstream edited it) -> stay deleted.
              # UD/UU/AA = keep our version.
              git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' f; do
                case "$(git status --porcelain=v1 -- "$f" | cut -c1-2)" in
                  DU) git rm -f -q -- "$f" ;;
                  *)  git checkout --ours -- "$f" && git add -- "$f" ;;
                esac
              done
              git commit --no-edit
              RESULT=resolved
            else
              git merge --abort
              git reset --hard upstream/main
              RESULT=conflict
            fi
          fi
          git push origin "$BRANCH"
          create_pr() {
            TITLE="$1"; BODY="$2"
            EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${BRANCH}" --jq 'length')
            if [ "$EXISTING" -gt 0 ]; then
              echo "PR for ${BRANCH} already exists; skipping creation."
              return 0
            fi
            for attempt in 1 2 3; do
              if gh api "repos/${GITHUB_REPOSITORY}/pulls" \
                -f base=main -f head="$BRANCH" \
                -f title="$TITLE" -f body="$BODY" --jq .html_url > /tmp/create_pr_out 2>/tmp/create_pr_err; then
                cat /tmp/create_pr_out
                return 0
              fi
              echo "::warning::create_pr attempt $attempt/3 failed: $(cat /tmp/create_pr_err)"
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            echo "::error::create_pr failed after 3 attempts: $(cat /tmp/create_pr_err)"
            exit 1
          }
          if [ "$RESULT" = conflict ]; then
            create_pr "Upstream sync $(date +%Y-%m-%d): manual resolution needed" \
              "$(printf 'Merging upstream/main conflicts outside tool/ in:\n\n%s\n\nResolve locally per light-workspace/docs/SYNCING.md. This branch is pinned at upstream/main — no conflict markers are committed.' "$OUTSIDE")"
          else
            create_pr "Upstream sync $(date +%Y-%m-%d)" \
              "Merge of upstream/main ($RESULT). tool/ conflicts, if any, auto-resolved in this repo's favor. Review the SDK changes and merge when CI is green."
          fi
